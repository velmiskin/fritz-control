<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FritzControl</title><link rel="stylesheet" href="/style.css"></head><body>
<main class="shell"><header><div><p class="eyebrow">ESP32 · FRITZ!Box</p><h1>FritzControl</h1></div><button id="logout" class="ghost hidden">Log out</button></header>
<section id="login-card" class="card login-card"><h2>Dashboard login</h2><p>Use the local admin password from <code>config.json</code>.</p><form id="login-form"><input id="password" type="password" autocomplete="current-password" required placeholder="Admin password"><button>Sign in</button></form><p id="login-error" class="error"></p></section>
<div id="dashboard" class="hidden"><section class="status-grid"><article class="card metric"><span>Recovery</span><strong id="recovery">—</strong></article><article class="card metric"><span>Clock</span><strong id="clock">—</strong></article><article class="card metric"><span>Timers</span><strong id="timer-count">0</strong></article></section>
<section class="card"><div class="section-head"><div><p class="eyebrow">Network</p><h2>Devices</h2></div><button id="refresh" class="ghost">Refresh</button></div><p id="device-state" class="muted">Loading…</p><div class="table-wrap"><table><thead><tr><th>Device</th><th>IP</th><th>Status</th><th>Action</th></tr></thead><tbody id="devices"></tbody></table></div></section>
<section class="card"><div class="section-head"><div><p class="eyebrow">Active</p><h2>Timers</h2></div></div><div id="timers" class="stack muted">No active timers.</div></section>
<section class="card"><div class="section-head"><div><p class="eyebrow">Weekly</p><h2>Blocking schedules</h2></div></div><form id="schedule-form" class="schedule-form"><input id="schedule-ip" placeholder="192.168.178.30" required><select id="schedule-day"><option value="0">Monday</option><option value="1">Tuesday</option><option value="2">Wednesday</option><option value="3">Thursday</option><option value="4">Friday</option><option value="5">Saturday</option><option value="6">Sunday</option></select><input id="schedule-start" type="time" required><input id="schedule-end" type="time" required><button>Add interval</button></form><div id="schedules" class="stack muted">No weekly schedules.</div><button id="save-schedules" class="wide">Save schedules</button></section><p id="toast" class="toast hidden"></p></div></main><script src="/app.js"></script></body></html>
